services:
  db:
    image: mysql:8.0
    container_name: coffee-house-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: coffee_house
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docs/database_schema.sql:/docker-entrypoint-initdb.d/01-database_schema.sql:ro
      - ./docs/setup_test_users.sql:/docker-entrypoint-initdb.d/02-setup_test_users.sql:ro

  backend:
    build:
      context: ./backend
    container_name: coffee-house-backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: coffee_house
      PORT: 3000
      NODE_ENV: production
      JWT_SECRET: replace_this_in_production
      JWT_REFRESH_SECRET: replace_this_refresh_secret
      JWT_EXPIRES_IN: 7d
      JWT_REFRESH_EXPIRES_IN: 30d
      CORS_ORIGIN: http://localhost:8080
      API_PREFIX: /api/v1
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:3000/api/v1
        VITE_APP_NAME: Coffee House Management System
    container_name: coffee-house-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mysql_data:
